# Blueprint Render : "New +" → "Blueprint" → pointer ce repo.
# Les clés `sync: false` seront demandées une par une lors de la création
# (elles ne sont jamais stockées dans ce fichier ni dans git).
services:
  - type: web
    name: noctis-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Noctis Taxi"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_URL
        sync: false # https://<ton-service>.onrender.com (ou domaine custom)
      - key: APP_KEY
        sync: false # généré en local : php artisan key:generate --show
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: noctis-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      # Pas de worker persistant sur le plan gratuit : les jobs (emails/SMS)
      # s'exécutent en synchrone dans la requête au lieu d'être mis en file.
      - key: QUEUE_CONNECTION
        value: sync
      # Gmail SMTP -- MAIL_USERNAME/PASSWORD/FROM_ADDRESS a saisir manuellement
      # sur Render (mot de passe d'application Google, pas le mot de passe du
      # compte -- voir myaccount.google.com/apppasswords).
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false # doit etre identique a MAIL_USERNAME (Gmail l'exige)
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      # Creation du compte admin (voir docker-entrypoint.sh) -- a retirer une
      # fois le compte cree, sinon un redemarrage reecrase le mot de passe.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: noctis-db
    plan: free
    databaseName: noctis
    user: noctis
