# Blueprint Render : "New +" → "Blueprint" → pointer ce repo.
# Les clés `sync: false` seront demandées une par une lors de la création
# (elles ne sont jamais stockées dans ce fichier ni dans git).
services:
  - type: web
    name: noctis-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Noctis Taxi"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # TEMPORAIRE (tests responsive en iframe) : a retirer avant la mise en
      # production reelle pour retablir l'anti-clickjacking.
      - key: ALLOW_IFRAME_EMBEDDING
        value: "true"
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_URL
        sync: false # https://<ton-service>.onrender.com (ou domaine custom)
      - key: APP_KEY
        sync: false # généré en local : php artisan key:generate --show
      # stderr et non stack : storage/logs/laravel.log n'est pas visible dans
      # l'onglet Logs de Render. En dur ici pour ne pas etre ecrase par un
      # futur sync du blueprint si quelqu'un le change a la main sur Render.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: noctis-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      # Pas de worker persistant sur le plan gratuit : les jobs (emails/SMS)
      # s'exécutent en synchrone dans la requête au lieu d'être mis en file.
      - key: QUEUE_CONNECTION
        value: sync
      # Resend (API HTTP, pas SMTP) -- le plan gratuit Render bloque les
      # connexions SMTP sortantes (port 587/465), Gmail SMTP timeout donc
      # systematiquement. Resend passe par HTTPS (443), jamais bloque.
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_FROM_ADDRESS
        value: onboarding@resend.dev # sans domaine verifie sur Resend
      - key: RESEND_API_KEY
        sync: false # cle re_... depuis resend.com -> API Keys
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      # Creation du compte admin (voir docker-entrypoint.sh) -- a retirer une
      # fois le compte cree, sinon un redemarrage reecrase le mot de passe.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Images vehicules (admin) : stockage persistant sur Cloudinary (gratuit,
      # sans carte bancaire), le disque local de Render (plan gratuit) n'etant
      # pas persistant. Facultatif : sans CLOUDINARY_URL, l'upload retombe sur
      # le disque local (fonctionne mais non persistant) -- voir config/
      # filesystems.php "vehicle_images_disk".
      - key: CLOUDINARY_URL
        sync: false # cloudinary.com -> Dashboard -> "API Environment variable"

databases:
  - name: noctis-db
    plan: free
    databaseName: noctis
    user: noctis
