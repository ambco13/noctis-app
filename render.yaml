# Blueprint Render : "New +" → "Blueprint" → pointer ce repo.
# Les clés `sync: false` seront demandées une par une lors de la création
# (elles ne sont jamais stockées dans ce fichier ni dans git).
services:
  - type: web
    name: noctis-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Noctis Taxi"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_URL
        sync: false # https://<ton-service>.onrender.com (ou domaine custom)
      - key: APP_KEY
        sync: false # généré en local : php artisan key:generate --show
      # stderr et non stack : storage/logs/laravel.log n'est pas visible dans
      # l'onglet Logs de Render. En dur ici pour ne pas etre ecrase par un
      # futur sync du blueprint si quelqu'un le change a la main sur Render.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: noctis-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      # Pas de worker persistant sur le plan gratuit : les jobs (emails/SMS)
      # s'exécutent en synchrone dans la requête au lieu d'être mis en file.
      - key: QUEUE_CONNECTION
        value: sync
      # Resend (API HTTP, pas SMTP) -- le plan gratuit Render bloque les
      # connexions SMTP sortantes (port 587/465), Gmail SMTP timeout donc
      # systematiquement. Resend passe par HTTPS (443), jamais bloque.
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_FROM_ADDRESS
        value: onboarding@resend.dev # sans domaine verifie sur Resend
      - key: RESEND_API_KEY
        sync: false # cle re_... depuis resend.com -> API Keys
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      # Creation du compte admin (voir docker-entrypoint.sh) -- a retirer une
      # fois le compte cree, sinon un redemarrage reecrase le mot de passe.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Stockage des images vehicules sur Cloudflare R2 (S3-compatible) : le
      # disque local de Render (plan gratuit) n'est PAS persistant, tout
      # fichier uploade via l'admin disparait au prochain redemarrage/deploy.
      # Sans ces variables, FILESYSTEM_DISK reste "local" (comportement dev,
      # non persistant sur Render).
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false # R2 dashboard -> Manage API Tokens
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false # nom du bucket R2 cree
      - key: AWS_ENDPOINT
        sync: false # https://<account_id>.r2.cloudflarestorage.com
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: AWS_URL
        sync: false # URL publique du bucket (r2.dev ou domaine custom)

databases:
  - name: noctis-db
    plan: free
    databaseName: noctis
    user: noctis
